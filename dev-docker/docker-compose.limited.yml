##########
# WARNING!
# This docker-compose file is meant for a limited development setup.
#########

services:
  weblate:
    image: weblate-dev:latest
    #command: sleep infinity
    build:
      context: ./weblate-dev/
      args:
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
    ports:
      # Use WEBLATE_PORT from environment, default to 8080 if not set
    - ${WEBLATE_PORT:-8080}:8080
    user: $USER_ID:$GROUP_ID
    userns_mode: host
    tmpfs:
    - /app/cache:uid=$USER_ID,gid=$GROUP_ID
    - /tmp:uid=$USER_ID,gid=$GROUP_ID,exec
    - /run:uid=$USER_ID,gid=$GROUP_ID
    volumes:
      # Local data directory (kept for persistence)
      - ./data:/app/data
      # Mount the entire project source code to a standard workspace location
      - ..:/workspaces/weblate:cached
    depends_on:
    - database
    - cache
    environment:
      DJANGO_SETTINGS_MODULE: weblate.settings_docker
    env_file:
    - ./environment
  database:
    image: postgres:17-alpine
    env_file:
    - ./environment
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ./postgres-init:/docker-entrypoint-initdb.d
    restart: always
    ports:
    - 5433:5432
  cache:
    image: redis:7-alpine
    restart: always
    command: [redis-server, --save, '60', '1']
    volumes:
    - redis-data:/data
volumes:
  # Note: weblate-data seems unused in the original service definition, keeping structure
  weblate-data: {}
  postgres-data: {}
  redis-data: {}
